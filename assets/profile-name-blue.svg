<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Koyel Kar</title>
  <desc id="desc">Blue neon profile banner featuring Koyel Kar and her current focus</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a14"/><stop offset=".55" stop-color="#070b12"/><stop offset="1" stop-color="#06101f"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#0A84FF" stop-opacity=".32"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#38bdf8" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="neon" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feFlood flood-color="#00A8FF" flood-opacity=".9" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1398" height="358" rx="24" fill="url(#bg)" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="2" y="2" width="1396" height="356" rx="23" fill="url(#grid)"/>
  <rect x="2" y="2" width="1396" height="356" rx="23" fill="url(#glow)"/>
  <g fill="none" stroke="#00a8ff" stroke-width="5" stroke-linecap="round"><path d="M34 72V34H72M1328 34h38v38M34 288v38h38M1366 288v38h-38"/></g>
  <rect x="538" y="38" width="324" height="42" rx="21" fill="#08111f" stroke="#0A84FF" stroke-width="1.5"/>
  <circle cx="562" cy="59" r="7" fill="#38bdf8"/>
  <text x="704" y="65" text-anchor="middle" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CURRENTLY BUILDING</text>
  <text x="700" y="174" text-anchor="middle" fill="#f0f9ff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="9" filter="url(#neon)">KOYEL KAR</text>
  <text x="700" y="226" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI-POWERED APPLICATIONS  ·  SECURITY TOOLS</text>
  <path d="M430 267H970" stroke="#00a8ff" stroke-opacity=".65" stroke-width="2"/>
  <text x="700" y="309" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">PYTHON  ·  AI  ·  OPEN-SOURCE PROJECTS</text>
</svg>
