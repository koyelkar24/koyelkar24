  <text x="700" y="193" text-anchor="middle" fill="#fff6f7" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="8" filter="url(#softGlow)">KOYEL KAR</text>
  <path d="M475 242H925" stroke="#ff304d" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="460" cy="242" r="3" fill="#ff304d"/>
