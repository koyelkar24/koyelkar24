<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Koyel Kar</title>
  <desc id="desc">Neon red profile name banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10080b"/>
      <stop offset="0.55" stop-color="#09090d"/>
      <stop offset="1" stop-color="#16070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#e31837" stop-opacity=".26"/>
      <stop offset="1" stop-color="#e31837" stop-opacity="0"/>
